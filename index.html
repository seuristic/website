<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      id="favicon"
      rel="icon"
      href="/favicon-light.svg"
      type="image/svg+xml"
    />
    <title>seuristic</title>
    <meta name="description" content="Personal site of Mohammad Shahanwaz." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />

    <!-- Applies the stored theme before first paint so there is no flash, and
         keeps the favicon on the matching variant whenever `.dark` changes. -->
    <script>
      ;(() => {
        const root = document.documentElement
        const stored = localStorage.getItem("theme")
        const dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        root.classList.toggle("dark", dark)

        const favicon = document.getElementById("favicon")
        const syncFavicon = () => {
          const theme = root.classList.contains("dark") ? "dark" : "light"
          favicon.href = `/favicon-${theme}.svg`
        }
        syncFavicon()
        new MutationObserver(syncFavicon).observe(root, {
          attributeFilter: ["class"],
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
