<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      id="favicon"
      rel="icon"
      href="/favicon-light.svg"
      type="image/svg+xml"
    />
    <title>seuristic</title>
    <meta name="description" content="Personal site of Mohammad Shahanwaz." />

    <!-- Link previews (X, LinkedIn, Slack, WhatsApp, …). Crawlers don't run JS,
         so every page shares this card; og:image must be an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shahanwaz.dev" />
    <meta property="og:site_name" content="seuristic" />
    <meta property="og:title" content="Mohammad Shahanwaz" />
    <meta
      property="og:description"
      content="AI Engineer at Nexla. Notes on AI, engineering and design."
    />
    <meta property="og:image" content="https://shahanwaz.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Mohammad Shahanwaz, AI Engineer at Nexla"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Pixel:ELSH@0..100&display=swap"
      rel="stylesheet"
    />

    <!-- Applies the stored theme before first paint so there is no flash, and
         keeps the favicon on the matching variant whenever `.dark` changes. -->
    <script>
      ;(() => {
        const root = document.documentElement
        const stored = localStorage.getItem('theme')
        const dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        root.classList.toggle('dark', dark)

        const favicon = document.getElementById('favicon')
        const syncFavicon = () => {
          const theme = root.classList.contains('dark') ? 'dark' : 'light'
          favicon.href = `/favicon-${theme}.svg`
        }
        syncFavicon()
        new MutationObserver(syncFavicon).observe(root, {
          attributeFilter: ['class'],
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
