<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Instrument Serif's own 'S' as an outline: a favicon renders in an isolated
       context with no network, so a webfont reference would never load.
       Centred on the glyph's tight ink bbox (its own absolute extents — no ascent,
       descent or line height involved) and scaled to 20 of 32 units, then drawn at
       four quarter turns about the centre. Two copies alone are only 2-fold
       symmetric, which reads as tilted; four make the union exactly 4-fold
       symmetric, so its centre of mass is the tile centre.
       The path repeats rather than <use>s it so nothing depends on ID resolution,
       and stays four separate fills so overlaps union instead of the nonzero
       fill-rule punching holes. Regenerate with fontTools if the font changes. -->
